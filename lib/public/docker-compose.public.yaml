services:
  public:
    image: ${BENTO_PUBLIC_IMAGE}:${BENTO_PUBLIC_VERSION}
    container_name: ${BENTO_PUBLIC_CONTAINER_NAME}
    networks:
      - public-net  # Bento Public, not a public network!
    environment:
      - BENTO_UID
      - BENTO_PUBLIC_SERVICE_ID
      - BENTO_PUBLIC_CLIENT_NAME
      - BENTO_PUBLIC_ADMIN_URL
      - BENTO_PUBLIC_SESSION_REFETCH_INTERVAL_SECONDS
      # backwards compatibility; can be removed in future version
      - BENTO_PUBLIC_PORTAL_URL=${BENTO_PUBLIC_ADMIN_URL}
      - BENTO_PUBLIC_TRANSLATED
      - BENTO_PUBLIC_TRANSLATED_LOGO
      - BENTO_PUBLIC_LOGO_HEIGHT
      - BENTO_PUBLIC_SHOW_LOGO
      - BENTO_PUBLIC_SHOW_HEADER_TITLE
      - BENTO_PUBLIC_SHOW_ADMIN_LINK
      - BENTO_PUBLIC_SHOW_SIGN_IN
      - BENTO_PUBLIC_FORCE_CATALOGUE
      - BENTO_PUBLIC_PCGL_MODE
      - BENTO_PUBLIC_CATALOGUE_HEADER_BACKGROUND
      - BENTO_PUBLIC_CATALOGUE_HEADER_TEXT_COLOR
      - BENTO_BEACON_UI_ENABLED
      - BENTO_BEACON_NETWORK_ENABLED
      - BEACON_URL=${BENTOV2_PUBLIC_URL}/api/beacon
      - BENTO_PUBLIC_URL=${BENTOV2_PUBLIC_URL}
      - BENTO_PUBLIC_PORT=${BENTO_PUBLIC_INTERNAL_PORT}
      - OPENID_CONFIG_URL=${BENTOV2_AUTH_PUBLIC_URL}${BENTOV2_AUTH_WELLKNOWN_PATH}
      - CLIENT_ID=${BENTOV2_AUTH_CLIENT_ID}
      - AUTH_SECRET=${BENTO_PUBLIC_AUTH_SECRET}
      - AUTH_URL=${BENTOV2_PUBLIC_URL}
    expose:
      - "${BENTO_PUBLIC_INTERNAL_PORT}"
    volumes:
      # branding 
      - ${PWD}/lib/public/en_about.html:/bento-public/public/public/en_about.html
      - ${PWD}/lib/public/fr_about.html:/bento-public/public/public/fr_about.html
      
      - ${PWD}/lib/public/branding.png:/bento-public/public/public/assets/branding.png
      - ${PWD}/lib/public/branding.fr.png:/bento-public/public/public/assets/branding.fr.png
      - ${PWD}/lib/public/branding.lightbg.png:/bento-public/public/public/assets/branding.lightbg.png
      - ${PWD}/lib/public/branding.lightbg.fr.png:/bento-public/public/public/assets/branding.lightbg.fr.png

      - ${PWD}/lib/public/instance.css:/bento-public/public/public/styles/instance.css:ro
      # i18n
      - ${PWD}/lib/public/translations/en.json:/bento-public/public/public/locales/en/translation_en.json
      - ${PWD}/lib/public/translations/fr.json:/bento-public/public/public/locales/fr/translation_fr.json
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:${BENTO_PUBLIC_INTERNAL_PORT}/service-info" ]
      timeout: ${BENTO_HEALTHCHECK_TIMEOUT}
      interval: ${BENTO_HEALTHCHECK_INTERVAL}
      start_period: ${BENTO_HEALTHCHECK_START_PERIOD}
      start_interval: ${BENTO_HEALTHCHECK_START_INTERVAL}
    profiles:
      - public

networks:
  katsu-net:
    external: true
    name: ${BENTO_KATSU_NETWORK}
  public-net:
    external: true
    name: ${BENTO_PUBLIC_NETWORK}
  wes-net:
    external: true
    name: ${BENTO_WES_NETWORK}
  gohan-api-net:
    external: true
    name: ${BENTO_GOHAN_API_NETWORK}
